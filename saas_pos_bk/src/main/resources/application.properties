spring.application.name=saas_pos_bk

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/pos?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASS:1234}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

server.port=${PORT:8080}

app.jwt.secret=${JWT_SECRET:SuperSecureSecretKeyForSaasPosSystemMustBeAtLeast32BytesLong123}
app.jwt.expiration=86400000